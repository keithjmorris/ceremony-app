<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recordings — Ceremony</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@mux/mux-player@3" defer></script>
</head>
<body>
<div class="wrap wide">
  <div class="card" id="content" style="display:none;">
    <nav class="tabs">
      <a href="/live.html">Watch</a>
      <a href="/gallery.html">Photos</a>
      <a href="/upload.html">Add photo</a>
      <a href="/recordings.html" class="active">Recordings</a>
    </nav>

    <p class="eyebrow">Watch again</p>
    <h1>Recordings</h1>
    <p class="sub">Every past broadcast, ready to watch whenever you like.</p>

    <div class="player-frame" id="playerFrame" style="display:none;">
      <mux-player id="player" playback-id="" metadata-video-title="Recording"></mux-player>
    </div>

    <div id="list"></div>
    <p class="gallery-empty" id="empty" style="display:none;">No recordings have been added yet — check back soon.</p>

    <a class="foot-link" href="#" id="signout-link">Sign out</a>
  </div>
</div>

<style>
  .recording-row {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    text-align: left;
    padding: 10px;
    margin-bottom: 8px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: #fff;
    font-family: var(--font-body);
    font-size: 15px;
    color: var(--ink);
    cursor: pointer;
  }
  .recording-row .recording-thumb {
    width: 96px;
    aspect-ratio: 16/9;
    object-fit: cover;
    border-radius: 3px;
    background: #000;
    flex-shrink: 0;
  }
  .recording-row:hover { border-color: var(--forest-dim); }
  .recording-row.playing { border-color: var(--forest); background: #F2F1E9; }
</style>

<script type="module">
  import { requireGuest, signOutGuest, db, getGuestEmail } from '/js/auth.js';
  import { ADMIN_EMAIL } from '/js/firebase-config.js';
  import { collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  requireGuest(async () => {
    document.getElementById('content').style.display = 'block';

    if (getGuestEmail() === ADMIN_EMAIL) {
      const adminLink = document.createElement('a');
      adminLink.href = '/admin.html';
      adminLink.className = 'foot-link';
      adminLink.textContent = 'Add a recording (admin)';
      document.getElementById('content').appendChild(adminLink);
    }

    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    const playerFrame = document.getElementById('playerFrame');
    const player = document.getElementById('player');

    // Recordings are documents in the "videos" collection: { title, playbackId, order }
    const q = query(collection(db, 'videos'), orderBy('order', 'asc'));
    const snap = await getDocs(q);

    if (snap.empty) {
      empty.style.display = 'block';
    } else {
      snap.forEach((docSnap) => {
        const data = docSnap.data();
        const row = document.createElement('button');
        row.type = 'button';
        row.className = 'recording-row';
        row.innerHTML = `
          <img class="recording-thumb" src="https://image.mux.com/${data.playbackId}/thumbnail.jpg?width=320&time=1" alt="">
          <span>${data.title || 'Untitled recording'}</span>
        `;
        row.addEventListener('click', () => {
          document.querySelectorAll('.recording-row').forEach(r => r.classList.remove('playing'));
          row.classList.add('playing');
          player.setAttribute('playback-id', data.playbackId);
          playerFrame.style.display = 'block';
          playerFrame.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        list.appendChild(row);
      });
    }

    document.getElementById('signout-link').addEventListener('click', (e) => {
      e.preventDefault();
      signOutGuest();
      window.location.href = '/index.html';
    });
  });
</script>
</body>
</html>
