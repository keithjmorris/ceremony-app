<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add a photo — Ceremony</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">
  <div class="card" id="content" style="display:none;">
    <nav class="tabs">
      <a href="/live.html">Watch</a>
      <a href="/gallery.html">Photos</a>
      <a href="/upload.html" class="active">Add photo</a>
    </nav>

    <p class="eyebrow">Share a photo</p>
    <h1>Add to the album</h1>
    <p class="sub">Your photo appears in the album for every guest right after it uploads.</p>

    <form id="upload-form">
      <label for="file">Choose a photo</label>
      <input type="file" id="file" accept="image/*" required style="margin-bottom:16px;">

      <label for="caption">Caption (optional)</label>
      <input type="text" id="caption" placeholder="e.g. Just before the vows" style="width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:3px;font-family:var(--font-body);font-size:15px;margin-bottom:16px;">

      <button type="submit" id="submit-btn">Upload photo</button>
    </form>

    <div class="msg" id="msg"></div>
    <a class="foot-link" href="/gallery.html">Back to the album</a>
  </div>
</div>

<script type="module">
  import { requireGuest, db } from '/js/auth.js';
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";
  import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  const storage = getStorage();

  requireGuest((guest) => {
    document.getElementById('content').style.display = 'block';

    const form = document.getElementById('upload-form');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById('file');
      const file = fileInput.files[0];
      if (!file) return;

      btn.disabled = true;
      btn.textContent = 'Uploading…';
      msg.className = 'msg';

      try {
        const safeName = `${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.\-_]/g, '_')}`;
        const storageRef = ref(storage, `photos/${safeName}`);
        await uploadBytes(storageRef, file, { contentType: file.type });
        const url = await getDownloadURL(storageRef);

        await addDoc(collection(db, 'photos'), {
          url,
          caption: document.getElementById('caption').value.trim(),
          uploadedBy: guest.email,
          createdAt: serverTimestamp()
        });

        msg.textContent = 'Uploaded! Taking you to the album…';
        msg.className = 'msg show success';
        setTimeout(() => { window.location.href = '/gallery.html'; }, 900);
      } catch (err) {
        console.error(err);
        msg.textContent = "That upload didn't go through — please try again.";
        msg.className = 'msg show error';
        btn.disabled = false;
        btn.textContent = 'Upload photo';
      }
    });
  });
</script>
</body>
</html>
