<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live — Ceremony</title>
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#33472F">
<link rel="stylesheet" href="/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@mux/mux-player@3" defer></script>
</head>
<body>
<div class="wrap wide">
  <div class="card" id="content" style="display:none;">
    <nav class="tabs">
      <a href="/live.html" class="active">Watch</a>
      <a href="/gallery.html">Photos</a>
      <a href="/upload.html">Add photo</a>
      <a href="/recordings.html">Recordings</a>
    </nav>

    <div class="seal" id="seal">Loading</div>
    <p class="eyebrow" id="status-label">Checking status&hellip;</p>
    <h1 id="event-name">The Ceremony</h1>
    <p class="sub" id="status-sub">One moment while we connect.</p>

    <div class="player-frame">
      <mux-player id="player" playback-id="" metadata-video-title="Ceremony" autoplay="muted"></mux-player>
    </div>

    <a class="foot-link" href="#" id="signout-link">Sign out</a>
  </div>
</div>

<script type="module">
  import { requireGuest, signOutGuest } from '/js/auth.js';
  import { MUX_PLAYBACK_ID, EVENT_NAME } from '/js/firebase-config.js';

  requireGuest((user) => {
    document.getElementById('content').style.display = 'block';
    document.getElementById('event-name').textContent = EVENT_NAME;

    const player = document.getElementById('player');
    player.setAttribute('playback-id', MUX_PLAYBACK_ID);

    // If the stream isn't live yet (or briefly drops), quietly retry every few
    // seconds rather than making guests refresh the page themselves.
    player.addEventListener('error', () => {
      setTimeout(() => {
        player.setAttribute('playback-id', MUX_PLAYBACK_ID);
      }, 5000);
    });

    // Once a broadcast ends, the player happily shows the recording and stops
    // erroring — so if a guest leaves the page open, it would never notice a
    // *later* broadcast starting. Keep quietly rechecking unless we're
    // currently showing live video.
    setInterval(() => {
      const isLive = player.streamType === 'live' || player.streamType === 'll-live';
      if (!isLive) {
        player.setAttribute('playback-id', MUX_PLAYBACK_ID);
      }
    }, 15000);

    // mux-player exposes stream state once metadata loads; we reflect it in the seal + copy.
    player.addEventListener('loadedmetadata', () => {
      const isLive = player.streamType === 'live' || player.streamType === 'll-live';
      const seal = document.getElementById('seal');
      if (isLive) {
        seal.textContent = 'Live Now';
        seal.className = 'seal is-live';
        document.getElementById('status-label').textContent = 'Streaming now';
        document.getElementById('status-sub').textContent = "You're watching live.";
      } else {
        seal.textContent = 'Recorded';
        seal.className = 'seal is-archived';
        document.getElementById('status-label').textContent = 'Recording';
        document.getElementById('status-sub').textContent = "The live stream has ended — here's the recording.";
      }
    });

    document.getElementById('signout-link').addEventListener('click', (e) => {
      e.preventDefault();
      signOutGuest();
      window.location.href = '/index.html';
    });
  });
</script>
</body>
</html>
