<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add a photo or video — Ceremony</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">
  <div class="card" id="content" style="display:none;">
    <nav class="tabs">
      <a href="/live.html">Watch</a>
      <a href="/gallery.html">Photos</a>
      <a href="/upload.html" class="active">Add photo</a>
      <a href="/recordings.html">Recordings</a>
    </nav>

    <p class="eyebrow">Share a photo or video</p>
    <h1>Add to the album</h1>
    <p class="sub" id="intro-text">Your photo or video appears in the album for every guest right after it uploads. Photos up to 15MB, videos up to 300MB.</p>

    <form id="upload-form">
      <label for="file">Choose a photo or video</label>
      <input type="file" id="file" accept="image/*,video/*" required style="margin-bottom:16px;">

      <label for="caption">Caption (optional)</label>
      <input type="text" id="caption" placeholder="e.g. Just before the vows" style="width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:3px;font-family:var(--font-body);font-size:15px;margin-bottom:16px;">

      <button type="submit" id="submit-btn">Upload</button>
    </form>

    <div class="msg" id="msg"></div>
    <a class="foot-link" href="/gallery.html">Back to the album</a>
  </div>
</div>

<script type="module">
  import { requireGuest, db } from '/js/auth.js';
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";
  import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  const storage = getStorage();
  const MAX_IMAGE_BYTES = 15 * 1024 * 1024;
  const MAX_VIDEO_BYTES = 300 * 1024 * 1024;

  requireGuest((guest) => {
    document.getElementById('content').style.display = 'block';

    const form = document.getElementById('upload-form');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById('file');
      const file = fileInput.files[0];
      if (!file) return;

      const isVideo = file.type.startsWith('video/');
      const isImage = file.type.startsWith('image/');
      if (!isVideo && !isImage) {
        msg.textContent = "That file doesn't look like a photo or video — please choose a different file.";
        msg.className = 'msg show error';
        return;
      }
      const maxBytes = isVideo ? MAX_VIDEO_BYTES : MAX_IMAGE_BYTES;
      if (file.size > maxBytes) {
        msg.textContent = `That file is too large — ${isVideo ? 'videos' : 'photos'} are capped at ${Math.round(maxBytes / (1024 * 1024))}MB.`;
        msg.className = 'msg show error';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Uploading…';
      msg.className = 'msg';

      try {
        const folder = isVideo ? 'clips' : 'photos';
        const safeName = `${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.\-_]/g, '_')}`;
        const storagePath = `${folder}/${safeName}`;
        const storageRef = ref(storage, storagePath);
        await uploadBytes(storageRef, file, { contentType: file.type });
        const url = await getDownloadURL(storageRef);

        await addDoc(collection(db, 'photos'), {
          url,
          storagePath,
          type: isVideo ? 'video' : 'image',
          caption: document.getElementById('caption').value.trim(),
          uploadedBy: guest.email,
          createdAt: serverTimestamp()
        });

        msg.textContent = 'Uploaded! Taking you to the album…';
        msg.className = 'msg show success';
        setTimeout(() => { window.location.href = '/gallery.html'; }, 900);
      } catch (err) {
        console.error(err);
        msg.textContent = "That upload didn't go through — please try again.";
        msg.className = 'msg show error';
        btn.disabled = false;
        btn.textContent = 'Upload';
      }
    });
  });
</script>
</body>
</html>
