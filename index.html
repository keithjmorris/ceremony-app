<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're invited</title>
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#33472F">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="seal">Invite<br>Only</div>
    <p class="eyebrow">Private ceremony</p>
    <h1>You're invited</h1>
    <p class="sub">Enter your email and the passcode from your invitation to view the ceremony and photos.</p>

    <form id="access-form">
      <label for="email">Email address</label>
      <input type="email" id="email" required placeholder="you@example.com" autocomplete="email" style="margin-bottom:16px;">

      <label for="passcode">Passcode</label>
      <input type="text" id="passcode" required placeholder="From your invitation" autocomplete="off">

      <button type="submit" id="submit-btn">Enter</button>
    </form>

    <div class="msg" id="msg"></div>
  </div>
</div>

<script type="module">
  import { checkAccess, getGuestEmail } from '/js/auth.js';

  // If this browser already has a valid, saved sign-in, skip straight past
  // the form instead of asking again.
  if (window.localStorage.getItem('ceremony_verified') === 'true' && getGuestEmail()) {
    window.location.href = '/live.html';
  }

  const form = document.getElementById('access-form');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const passcode = document.getElementById('passcode').value;

    btn.disabled = true;
    btn.textContent = 'Checking…';
    msg.className = 'msg';

    try {
      const ok = await checkAccess(email, passcode);
      if (ok) {
        window.location.href = '/live.html';
      } else {
        msg.textContent = "That email or passcode doesn't match our guest list — please check and try again.";
        msg.className = 'msg show error';
        btn.disabled = false;
        btn.textContent = 'Enter';
      }
    } catch (err) {
      console.error(err);
      msg.textContent = "Something went wrong — please try again.";
      msg.className = 'msg show error';
      btn.disabled = false;
      btn.textContent = 'Enter';
    }
  });
</script>
</body>
</html>
