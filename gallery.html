<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photos — Ceremony</title>
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#33472F">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">
  <div class="card" id="content" style="display:none;">
    <nav class="tabs">
      <a href="/live.html">Watch</a>
      <a href="/gallery.html" class="active">Photos</a>
      <a href="/upload.html">Add photo</a>
      <a href="/recordings.html">Recordings</a>
    </nav>

    <p class="eyebrow">Photo album</p>
    <h1>Moments</h1>
    <p class="sub">Photos shared by everyone at the ceremony. Newest first. Tap a photo to enlarge it.</p>

    <div class="gallery-grid" id="grid"></div>
    <p class="gallery-empty" id="empty" style="display:none;">No photos have been added yet — check back soon.</p>

    <a class="foot-link" href="#" id="signout-link">Sign out</a>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Close">← Back</button>
  <button type="button" class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous photo">‹</button>
  <img class="lightbox-img" id="lightbox-img" src="" alt="">
  <video class="lightbox-img" id="lightbox-video" controls playsinline style="display:none;"></video>
  <button type="button" class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next photo">›</button>
  <p class="lightbox-caption" id="lightbox-caption"></p>
</div>

<style>
  .photo-tile video {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 3px;
    border: 1px solid var(--line);
    display: block;
    background: #000;
  }
  .video-badge {
    position: absolute;
    bottom: 8px;
    left: 8px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20, 19, 16, 0.94);
    z-index: 100;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .lightbox.open { display: flex; }
  .lightbox-img {
    max-width: min(90vw, 900px);
    max-height: 78vh;
    object-fit: contain;
    border-radius: 3px;
  }
  .lightbox-caption {
    color: #EDE9DD;
    font-family: var(--font-body);
    font-size: 14px;
    margin-top: 16px;
    text-align: center;
    max-width: 80vw;
  }
  .lightbox-close {
    position: absolute;
    top: 20px;
    left: 20px;
    width: auto;
    padding: 10px 16px;
    background: rgba(255,255,255,0.12);
    color: #fff;
    border: none;
    border-radius: 3px;
    font-family: var(--font-body);
    font-size: 14px;
    cursor: pointer;
  }
  .lightbox-close:hover { background: rgba(255,255,255,0.22); }
  .lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.12);
    color: #fff;
    font-size: 26px;
    line-height: 1;
    cursor: pointer;
  }
  .lightbox-nav:hover { background: rgba(255,255,255,0.22); }
  .lightbox-prev { left: 16px; }
  .lightbox-next { right: 16px; }
  @media (max-width: 640px) {
    .lightbox-nav { width: 40px; height: 40px; font-size: 22px; }
  }
</style>

<script type="module">
  import { requireGuest, signOutGuest, db, getGuestEmail } from '/js/auth.js';
  import { ADMIN_EMAIL } from '/js/firebase-config.js';
  import { collection, query, orderBy, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
  import { getStorage, ref, deleteObject } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";

  const storage = getStorage();

  requireGuest(async () => {
    document.getElementById('content').style.display = 'block';

    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    const myEmail = getGuestEmail();

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxVideo = document.getElementById('lightbox-video');
    const lightboxCaption = document.getElementById('lightbox-caption');
    const photos = []; // { url, caption, type }
    let currentIndex = 0;

    function openLightbox(index) {
      currentIndex = index;
      const p = photos[currentIndex];
      lightboxVideo.pause();
      if (p.type === 'video') {
        lightboxImg.style.display = 'none';
        lightboxVideo.style.display = 'block';
        lightboxVideo.src = p.url;
      } else {
        lightboxVideo.style.display = 'none';
        lightboxVideo.removeAttribute('src');
        lightboxImg.style.display = 'block';
        lightboxImg.src = p.url;
      }
      lightboxCaption.textContent = p.caption || '';
      lightbox.classList.add('open');
    }
    function closeLightbox() {
      lightboxVideo.pause();
      lightbox.classList.remove('open');
    }
    function showRelative(delta) {
      currentIndex = (currentIndex + delta + photos.length) % photos.length;
      openLightbox(currentIndex);
    }

    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    document.getElementById('lightbox-prev').addEventListener('click', () => showRelative(-1));
    document.getElementById('lightbox-next').addEventListener('click', () => showRelative(1));
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') showRelative(-1);
      if (e.key === 'ArrowRight') showRelative(1);
    });

    // Photos are documents in the "photos" collection: { url, storagePath, caption, uploadedBy, createdAt }
    const q = query(collection(db, 'photos'), orderBy('createdAt', 'desc'));
    const snap = await getDocs(q);

    if (snap.empty) {
      empty.style.display = 'block';
    } else {
      snap.forEach((docSnap) => {
        const data = docSnap.data();
        const canDelete = myEmail && (data.uploadedBy === myEmail || myEmail === ADMIN_EMAIL);
        const photoIndex = photos.length;
        photos.push({ url: data.url, caption: data.caption, type: data.type || 'image' });

        const tile = document.createElement('div');
        tile.className = 'photo-tile';

        const isVideo = data.type === 'video';
        const img = document.createElement(isVideo ? 'video' : 'img');
        img.src = data.url;
        if (isVideo) {
          img.muted = true;
          img.playsInline = true;
          img.preload = 'metadata';
        } else {
          img.alt = data.caption || 'Ceremony photo';
          img.loading = 'lazy';
        }
        img.style.cursor = 'pointer';
        img.addEventListener('click', () => openLightbox(photoIndex));
        tile.appendChild(img);

        if (isVideo) {
          const badge = document.createElement('span');
          badge.className = 'video-badge';
          badge.textContent = '▶';
          tile.appendChild(badge);
        }

        if (canDelete) {
          const del = document.createElement('button');
          del.type = 'button';
          del.className = 'photo-delete';
          del.setAttribute('aria-label', 'Delete photo');
          del.textContent = '×';
          del.addEventListener('click', async () => {
            if (!window.confirm('Delete this photo for everyone? This can\'t be undone.')) return;
            del.disabled = true;
            try {
              await deleteDoc(doc(db, 'photos', docSnap.id));
              if (data.storagePath) {
                await deleteObject(ref(storage, data.storagePath));
              }
              tile.remove();
              if (!grid.children.length) empty.style.display = 'block';
            } catch (err) {
              console.error(err);
              window.alert("Couldn't delete that photo — please try again.");
              del.disabled = false;
            }
          });
          tile.appendChild(del);
        }

        grid.appendChild(tile);
      });
    }

    document.getElementById('signout-link').addEventListener('click', (e) => {
      e.preventDefault();
      signOutGuest();
      window.location.href = '/index.html';
    });
  });
</script>
</body>
</html>
