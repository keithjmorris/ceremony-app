<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photos — Ceremony</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">
  <div class="card" id="content" style="display:none;">
    <nav class="tabs">
      <a href="/live.html">Watch</a>
      <a href="/gallery.html" class="active">Photos</a>
      <a href="/upload.html">Add photo</a>
      <a href="/recordings.html">Recordings</a>
    </nav>

    <p class="eyebrow">Photo album</p>
    <h1>Moments</h1>
    <p class="sub">Photos shared by everyone at the ceremony. Newest first.</p>

    <div class="gallery-grid" id="grid"></div>
    <p class="gallery-empty" id="empty" style="display:none;">No photos have been added yet — check back soon.</p>

    <a class="foot-link" href="#" id="signout-link">Sign out</a>
  </div>
</div>

<script type="module">
  import { requireGuest, signOutGuest, db } from '/js/auth.js';
  import { collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  requireGuest(async (user) => {
    document.getElementById('content').style.display = 'block';

    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');

    // Photos are documents in the "photos" collection: { url, caption, uploadedBy, createdAt }
    const q = query(collection(db, 'photos'), orderBy('createdAt', 'desc'));
    const snap = await getDocs(q);

    if (snap.empty) {
      empty.style.display = 'block';
    } else {
      snap.forEach((docSnap) => {
        const data = docSnap.data();
        const img = document.createElement('img');
        img.src = data.url;
        img.alt = data.caption || 'Ceremony photo';
        img.loading = 'lazy';
        grid.appendChild(img);
      });
    }

    document.getElementById('signout-link').addEventListener('click', (e) => {
      e.preventDefault();
      signOutGuest();
      window.location.href = '/index.html';
    });
  });
</script>
</body>
</html>
